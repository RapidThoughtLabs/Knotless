<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteLess</title>
  <!-- JetBrains Mono Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <!-- Row A: Header with Logo and Traffic Lights -->
  <div id="row-a" class="row-a">
    <div class="row-a-drag-region"></div>

    <!-- macOS Traffic Light Safe Area -->
    <div id="mac-safe-area" class="mac-safe-area">
      <div class="traffic-light-placeholder"></div>
      <div class="traffic-light-placeholder"></div>
      <div class="traffic-light-placeholder"></div>
    </div>

    <!-- App Logo -->
    <div class="app-logo">noteless</div>

    <!-- Windows Controls (only shown on Windows) -->
    <div id="windows-controls" class="windows-controls">
      <button id="minimize-btn" class="control-btn minimize-btn" aria-label="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect x="0" y="5" width="12" height="2" fill="currentColor" />
        </svg>
      </button>
      <button id="maximize-btn" class="control-btn maximize-btn" aria-label="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect x="0" y="0" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <button id="close-btn" class="control-btn close-btn" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path d="M 0,0 L 12,12 M 12,0 L 0,12" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Toast Notification Bar -->
  <div id="toast-bar" class="toast-bar hidden">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="M8 12l2.5 2.5L16 9"></path>
    </svg>
    <span id="toast-message"></span>
  </div>

  <!-- Row B: Filter Bar with Dropdown and Add Button -->
  <div id="row-b" class="row-b">
    <div class="row-b-drag-region"></div>

    <!-- Filter Dropdown -->
    <button id="filter-dropdown" class="filter-dropdown">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
      </svg>
      <span>recents</span>
      <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    <!-- Dropdown Menu (hidden by default) -->
    <div id="filter-menu" class="filter-menu hidden">
      <button class="filter-option active" data-filter="recents">recents</button>
      <button class="filter-option" data-filter="starred">starred</button>
      <button class="filter-option" data-filter="archives">archives</button>
    </div>

    <!-- Add Button -->
    <button id="add-btn" class="add-btn">
      <span>+ add</span>
    </button>
  </div>

  <!-- Main Content Area -->
  <div id="content" class="content">
    <!-- Tables will be rendered here -->
  </div>

  <!-- Add Table Modal -->
  <div id="add-table-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h3 class="modal-title">Create New Table</h3>
      <input type="text" id="table-name-input" class="modal-input" placeholder="Enter table name..."
        autocomplete="off" />
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="modal-btn modal-btn-cancel">Cancel</button>
        <button id="modal-add-btn" class="modal-btn modal-btn-add">Add</button>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <p id="confirm-message" class="modal-title"></p>
      <div class="modal-actions">
        <button id="confirm-cancel-btn" class="modal-btn modal-btn-cancel">Cancel</button>
        <button id="confirm-ok-btn" class="modal-btn modal-btn-add">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
